# XcodeGen spec for the Castle Protect iOS app. Generate with `xcodegen generate`.
# The .xcodeproj is not checked in.
name: CastleProtect
options:
  bundleIdPrefix: games.castleprotect
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    # The CastleCoreFFI module map and libcastle_ffi.a, written by scripts/core-module.sh.
    SWIFT_INCLUDE_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)/CastleCoreFFI
    LIBRARY_SEARCH_PATHS: $(inherited) $(BUILT_PRODUCTS_DIR)/CastleCoreFFI

targets:
  CastleProtect:
    type: application
    platform: iOS
    sources:
      - path: CastleProtect
      # Manifests and game content; @2x atlases, UI-only @2x sprites, AAC audio and Debug-only fixtures
      # are copied selectively in postCompileScripts below to keep Release bundle size lean (iOS-H11).
      - path: ../../assets/manifest.json
        buildPhase: resources
        optional: true
      # Frame order, times and events for every animation (assets/README.md).
      - path: ../../assets/animations.json
        buildPhase: resources
        optional: true
    preBuildScripts:
      - name: Core module map
        path: scripts/core-module.sh
        basedOnDependencyAnalysis: false
    postCompileScripts:
      # content: runtime JSON game data only (exclude content/schema/ and authoring *.md files, L-I01).
      - name: Copy content
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/../../content"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/content"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete --exclude='schema/' --exclude='*.md' "$SRC/" "$DST/"
            echo "Copied $(find "$DST" -type f | wc -l | tr -d ' ') content files."
          fi
      # assets/atlas: only @2x atlas sheets and index JSON (multi-page castle@2x-*.png / .json; iOS never loads @1x).
      - name: Copy @2x atlas
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/../../assets/atlas"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/atlas"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete --include='castle@2x*' --exclude='*' "$SRC/" "$DST/"
            echo "Copied $(find "$DST" -type f | wc -l | tr -d ' ') @2x atlas files."
          fi
      # assets/sprites: UI-only @2x sprites and app icon (all field props & Flattener frames come from the @2x atlas, L-I01).
      - name: Copy UI sprites
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/../../assets/sprites"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/sprites"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete \
              --include='portrait_*@2x.png' \
              --include='icon_*@2x.png' \
              --include='ui_*@2x.png' \
              --include='app_icon-512.png' \
              --exclude='*' "$SRC/" "$DST/"
            echo "Copied $(find "$DST" -type f | wc -l | tr -d ' ') UI sprite files."
          fi
      # core/fixtures: Debug only (for -uiTesting / FakeCoreBridge); stripped from Release builds.
      - name: Copy debug fixtures
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/../../core/fixtures"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/fixtures"
          if [ "${CONFIGURATION:-Debug}" = "Debug" ] && [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete "$SRC/" "$DST/"
          else
            rm -rf "$DST"
          fi
      # assets/audio: the manifests and the AAC (.m4a) files only; iOS never loads the Opus copies.
      - name: Copy audio
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/../../assets/audio"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/audio"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rsync -a --delete --include='*/' --include='*.m4a' --include='audio.json' --include='barks.json' --exclude='*' "$SRC/" "$DST/"
            echo "Copied $(find "$DST" -name '*.m4a' | wc -l | tr -d ' ') audio files."
          fi
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Castle Protect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIStatusBarStyle: UIStatusBarStyleDarkContent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: games.castleprotect.app
        PRODUCT_NAME: CastleProtect
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES

  CastleProtectTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CastleProtectTests
      - path: ../../core/fixtures
        type: folder
        buildPhase: resources
        optional: true
      # Golden replay hashes, to prove the linked arm64 core gives the same results.
      - path: ../../core/castle-core/tests/golden/expected.txt
        buildPhase: resources
        optional: true
    dependencies:
      - target: CastleProtect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: games.castleprotect.tests

  CastleProtectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/CastleProtectUITests
    dependencies:
      - target: CastleProtect
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: games.castleprotect.uitests

schemes:
  CastleProtect:
    build:
      targets:
        CastleProtect: all
        CastleProtectTests: [test]
        CastleProtectUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - CastleProtectTests
        - CastleProtectUITests

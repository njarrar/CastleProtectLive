# Determinism gate: run the same golden replays on Linux x86_64, macOS arm64
# and Wasm under Node, then check that every platform gives the same hashes.
#
# Contract with core/ (see scripts/run-golden.sh and scripts/golden-wasm.mjs):
#   native: the castle-core test with "golden" in its name writes
#           "<replay name> <hash>" lines to $CASTLE_GOLDEN_OUT when set.
#   wasm:   castle-wasm exports golden_hashes() returning the same lines.
# Until those exist, each job skips with a notice and the run stays green.
name: determinism

on:
  push:
    branches: [castle-protect-plan, main]
    paths:
      - "core/**"
      - "content/**"
      - "scripts/**"
      - ".github/workflows/determinism.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "22"
  WASM_BINDGEN_VERSION: "0.2.130"
  CARGO_TERM_COLOR: always

jobs:
  native:
    if: github.repository == 'njarrar/CastleProtectLive'
    name: golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check for core/castle-core
        id: check
        shell: bash
        run: |
          if [ -f core/castle-core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::core/castle-core not found, skipping golden replays."
          fi

      - name: Install Rust
        if: steps.check.outputs.present == 'true'
        run: scripts/setup-rust.sh

      - name: Cache cargo
        if: steps.check.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Run golden replays
        if: steps.check.outputs.present == 'true'
        run: scripts/run-golden.sh "golden-out/${{ runner.os }}-${{ runner.arch }}.txt"

      - name: Upload hashes
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: golden-${{ runner.os }}-${{ runner.arch }}
          path: golden-out/
          if-no-files-found: ignore

  wasm:
    if: github.repository == 'njarrar/CastleProtectLive'
    name: golden (wasm under node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check for core/castle-wasm
        id: check
        run: |
          if [ -f core/castle-wasm/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::core/castle-wasm not found, skipping wasm golden replays."
          fi

      - name: Install Rust
        if: steps.check.outputs.present == 'true'
        run: scripts/setup-rust.sh wasm32-unknown-unknown

      - name: Cache cargo
        if: steps.check.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Build castle-wasm for node
        if: steps.check.outputs.present == 'true'
        run: scripts/build-wasm.sh --target nodejs --out "$RUNNER_TEMP/castle-wasm-node"

      - uses: actions/setup-node@v7
        if: steps.check.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run golden replays in wasm
        if: steps.check.outputs.present == 'true'
        run: |
          mkdir -p golden-out
          node scripts/golden-wasm.mjs "$RUNNER_TEMP/castle-wasm-node" golden-out/wasm32.txt

      - name: Upload hashes
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: golden-wasm32
          path: golden-out/
          if-no-files-found: ignore

  compare:
    if: github.repository == 'njarrar/CastleProtectLive'
    needs: [native, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download hashes
        uses: actions/download-artifact@v8
        with:
          pattern: golden-*
          path: hashes
          merge-multiple: true

      - name: Compare hashes
        run: |
          mkdir -p hashes
          shopt -s nullglob
          files=(hashes/*.txt)
          if [ "${#files[@]}" -ne 3 ] || [ ! -f hashes/wasm32.txt ]; then
            echo "::error::Expected 3 platform hash files including hashes/wasm32.txt, found ${#files[@]}: ${files[*]}"
            exit 1
          fi
          ref="${files[0]}"
          fail=0
          for f in "${files[@]}"; do
            echo "$(basename "$f"): $(wc -l < "$f") replays, sha256 $(sha256sum < "$f" | cut -c1-16)"
          done
          for f in "${files[@]:1}"; do
            if ! diff -u "$ref" "$f"; then
              echo "::error::Golden hashes differ between $(basename "$ref") and $(basename "$f")."
              fail=1
            fi
          done
          if [ "$fail" -eq 0 ]; then
            echo "All ${#files[@]} platforms match."
          fi
          exit "$fail"

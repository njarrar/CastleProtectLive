# iOS app: build the core XCFramework, generate the Xcode project with
# XcodeGen, then build and test for the iPhone simulator without signing,
# then build Release for a device (unsigned) and check the privacy manifest.
# Skips with a notice while apps/ios does not exist yet.
# macOS minutes cost 10x Linux minutes on private repos, so this workflow only
# runs when iOS-related paths change.
name: ios

on:
  push:
    branches: [castle-protect-plan, main]
    paths:
      - "core/**"
      - "content/**"
      - "assets/**"
      - "apps/ios/**"
      - "scripts/build-xcframework.sh"
      - "scripts/setup-rust.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  # Scheme to build. If it does not exist, the first scheme in the project is used.
  IOS_SCHEME: CastleProtect
  CARGO_TERM_COLOR: always

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check for apps/ios and core/castle-ffi
        id: check
        run: |
          if [ -f apps/ios/project.yml ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/ios/project.yml not found, skipping iOS build."
          fi
          if [ -f apps/ios/project.yml ] && [ -f core/castle-ffi/Cargo.toml ]; then
            echo "core=true" >> "$GITHUB_OUTPUT"
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            echo "::notice::core/castle-ffi not found, building the app without a fresh XCFramework."
          fi

      - name: Install Rust
        if: steps.check.outputs.core == 'true'
        run: scripts/setup-rust.sh aarch64-apple-ios aarch64-apple-ios-sim

      - name: Cache cargo
        if: steps.check.outputs.core == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: Build XCFramework
        if: steps.check.outputs.core == 'true'
        run: scripts/build-xcframework.sh

      - name: Install XcodeGen
        if: steps.check.outputs.app == 'true'
        run: brew install xcodegen

      - name: Generate Xcode project
        if: steps.check.outputs.app == 'true'
        working-directory: apps/ios
        run: xcodegen generate

      - name: Pick project, scheme and simulator
        if: steps.check.outputs.app == 'true'
        id: pick
        working-directory: apps/ios
        run: |
          xcodebuild -version
          project="$(find . -maxdepth 1 -name '*.xcodeproj' | head -n1)"
          project="${project#./}"
          schemes="$(xcodebuild -list -json -project "$project" | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)["project"].get("schemes", [])))')"
          if printf '%s\n' "$schemes" | grep -qx "$IOS_SCHEME"; then
            scheme="$IOS_SCHEME"
          else
            scheme="$(printf '%s\n' "$schemes" | head -n1)"
            echo "::notice::Scheme $IOS_SCHEME not found, using $scheme."
          fi
          sim_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          best = None
          for runtime, devices in data.items():
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and d["name"].startswith("iPhone"):
                      key = (runtime, d["name"])
                      if best is None or key > best[0]:
                          best = (key, d["udid"])
          print(best[1] if best else "")
          ')"
          if [ -z "$sim_id" ]; then
            echo "::error::No iPhone simulator found on this runner."
            exit 1
          fi
          {
            echo "project=$project"
            echo "scheme=$scheme"
            echo "destination=platform=iOS Simulator,id=$sim_id"
          } >> "$GITHUB_OUTPUT"

      - name: Build for simulator
        if: steps.check.outputs.app == 'true'
        working-directory: apps/ios
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build \
            -project "${{ steps.pick.outputs.project }}" \
            -scheme "${{ steps.pick.outputs.scheme }}" \
            -configuration Debug \
            -destination "${{ steps.pick.outputs.destination }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-build.log

      - name: Test on simulator
        if: steps.check.outputs.app == 'true'
        working-directory: apps/ios
        run: |
          set +e
          xcodebuild test \
            -project "${{ steps.pick.outputs.project }}" \
            -scheme "${{ steps.pick.outputs.scheme }}" \
            -configuration Debug \
            -destination "${{ steps.pick.outputs.destination }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > build/xcodebuild-test.log 2>&1
          status=$?
          set -e
          grep -E "Test Case .* (passed|failed|skipped)|Executed [0-9]+ test|: error: " build/xcodebuild-test.log || true
          tail -n 40 build/xcodebuild-test.log
          if [ "$status" -ne 0 ] && grep -q "is not currently configured for the test action" build/xcodebuild-test.log; then
            echo "::notice::Scheme has no tests yet, skipping tests."
            exit 0
          fi
          exit "$status"

      - name: Check the real core was linked and tested
        if: steps.check.outputs.core == 'true'
        working-directory: apps/ios
        run: |
          grep -q "Linking the real core" build/xcodebuild-build.log || { echo "::error::The build used the stand-in core, not CastleCore.xcframework."; exit 1; }
          for t in testRealCoreWhenLinked testRefusedSetupIsReported testRescueLevelHasProps testGoldenHashesMatch testMultiTurnReplayMatchesTheHash testGiveUpOnTheRealCore testHelpVolleyAndBossSetupsStart; do
            if ! grep -qE "Test Case .*${t}\]' passed" build/xcodebuild-test.log; then
              echo "::error::Real-core test ${t} did not pass (skipped or missing)."
              exit 1
            fi
          done
          echo "Real core linked and real-core tests passed."

      # A Release build for a device (unsigned), the way an archive is built.
      # core-module.sh and CoreBridge.swift fail a Release build without the
      # real core, so this proves the device slice links and the stand-in
      # cannot ship.
      - name: Build Release for device (unsigned)
        # Runs even when a test failed, so one run reports every problem.
        if: ${{ !cancelled() && steps.check.outputs.core == 'true' }}
        working-directory: apps/ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ steps.pick.outputs.project }}" \
            -scheme "${{ steps.pick.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/xcodebuild-release.log
          grep -q "Linking the real core from .*ios-arm64" build/xcodebuild-release.log || { echo "::error::The Release device build did not link the real core's device slice."; exit 1; }

      # Required reason APIs (privacy manifest): list what the linked binary,
      # Rust std included, imports, and fail when a category is used but not
      # declared in PrivacyInfo.xcprivacy.
      - name: Check the privacy manifest against the binary
        # Runs even when a test failed, so one run reports every problem.
        if: ${{ !cancelled() && steps.check.outputs.core == 'true' }}
        working-directory: apps/ios
        run: |
          app="build/DerivedData/Build/Products/Release-iphoneos/CastleProtect.app"
          bin="$app/CastleProtect"
          test -f "$bin" || { echo "::error::No Release binary at $bin"; exit 1; }
          nm -u "$bin" | sed 's/^ *U *//' | sort -u > build/undefined-symbols.txt
          manifest="$app/PrivacyInfo.xcprivacy"
          test -f "$manifest" || { echo "::error::PrivacyInfo.xcprivacy is not in the app bundle"; exit 1; }
          fail=0
          check() {
            local category="$1"; shift
            local hits=""
            for sym in "$@"; do
              if grep -qx "_${sym}" build/undefined-symbols.txt; then hits="$hits $sym"; fi
            done
            if [ -n "$hits" ]; then
              echo "$category:$hits"
              if ! plutil -convert xml1 -o - "$manifest" | grep -q "$category"; then
                echo "::error::The binary calls$hits ($category) but PrivacyInfo.xcprivacy does not declare it."
                fail=1
              fi
            fi
          }
          check NSPrivacyAccessedAPICategoryFileTimestamp stat stat64 fstat fstat64 fstatat lstat lstat64 getattrlist fgetattrlist getattrlistbulk getattrlistat
          check NSPrivacyAccessedAPICategorySystemBootTime mach_absolute_time
          check NSPrivacyAccessedAPICategoryDiskSpace statfs statfs64 fstatfs fstatfs64 statvfs fstatvfs
          check NSPrivacyAccessedAPICategoryActiveKeyboards activeInputModes
          echo "Undefined symbols checked: $(wc -l < build/undefined-symbols.txt)"
          exit $fail

      - name: Zip simulator app
        if: steps.check.outputs.app == 'true'
        working-directory: apps/ios
        run: |
          app="$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -n1)"
          if [ -z "$app" ]; then
            echo "::error::No .app found in build products."
            exit 1
          fi
          ditto -c -k --keepParent "$app" build/CastleProtect-simulator.app.zip

      - name: Upload simulator app
        if: steps.check.outputs.app == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: castle-protect-ios-simulator-app
          path: apps/ios/build/CastleProtect-simulator.app.zip
          if-no-files-found: error

      - name: Upload test results
        if: failure() && steps.check.outputs.app == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            apps/ios/build/TestResults.xcresult
            apps/ios/build/*.log
            apps/ios/build/undefined-symbols.txt
          if-no-files-found: ignore


# Rust core: format, lint and tests on Linux.
# Skips with a notice while core/ does not exist yet.
name: core

on:
  push:
    branches: [castle-protect-plan, main]
    paths:
      - "core/**"
      - "content/**"
      - "scripts/setup-rust.sh"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "content/**"
      - "scripts/setup-rust.sh"
      - ".github/workflows/core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  core:
    if: github.repository == 'njarrar/CastleProtectLive'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Check for core/
        id: check
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::core/Cargo.toml not found, skipping core checks."
          fi

      - name: Install Rust
        if: steps.check.outputs.present == 'true'
        run: scripts/setup-rust.sh

      - name: Cache cargo
        if: steps.check.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core -> target

      - name: cargo fmt --check
        if: steps.check.outputs.present == 'true'
        working-directory: core
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: steps.check.outputs.present == 'true'
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        if: steps.check.outputs.present == 'true'
        working-directory: core
        run: cargo test --workspace

      - name: cargo test --release
        if: steps.check.outputs.present == 'true'
        working-directory: core
        run: cargo test --workspace --release
